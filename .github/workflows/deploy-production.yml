name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Deployment label (e.g. v1.0.0)
        required: false
        default: manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/nukeratframework/armory/tree/main
    steps:
      - uses: actions/checkout@v4

      - name: Record deployment
        run: echo "production @ ${{ github.sha }} (${{ inputs.version }})"
